server:
  port: 8080

spring:
  application:
    name: gestion-polizas
  datasource:
    url: jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  polizas:
    ipc: 0.05
    api-key: 123456
